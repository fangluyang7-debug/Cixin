  <text x="285" y="354" text-anchor="middle" class="boxText">保存基础资料与长期偏好</text>
  <text x="285" y="374" text-anchor="middle" class="boxText">允许用户主动编辑与确认系统记忆</text>

  <rect x="1120" y="846" rx="16" ry="16" width="320" height="86" fill="#EDE9FE" stroke="#A78BFA" stroke-width="2"/>
  <text x="1280" y="880" text-anchor="middle" class="boxTitle">配送时效与地理位置模块</text>
  <text x="1280" y="904" text-anchor="middle" class="boxText">作为附加参考输出预计送达时间</text>

  <rect x="1100" y="516" rx="16" ry="16" width="340" height="98" fill="#DBEAFE" stroke="#3B82F6" stroke-width="2"/>
