  <text x="468" y="316" class="label">识别纠错 / 默认偏好</text>
  <text x="178" y="520" class="label">长期偏好参与候选收敛</text>

  <path d="M1120 890H1030" stroke="#64748B" stroke-width="3" stroke-dasharray="9 7" marker-end="url(#arrow)"/>
  <text x="1075" y="874" text-anchor="middle" class="label">预计送达时间</text>

  <text x="846" y="280" class="label">图片 + 会话</text>
  <text x="846" y="400" class="label">商品画像</text>
  <text x="846" y="522" class="label">原始候选结果</text>
  <text x="846" y="644" class="label">标准化候选池</text>
  <text x="846" y="932" class="label">综合比较信息</text>

  <rect x="65" y="974" rx="14" ry="14" width="1470" height="180" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="2"/>
  <text x="95" y="1006" class="section">B. 支撑模块</text>

  <rect x="160" y="1032" rx="16" ry="16" width="560" height="82" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="2"/>
  <text x="440" y="1066" text-anchor="middle" class="boxTitle">会话与状态保持模块</text>
  <text x="440" y="1090" text-anchor="middle" class="boxText">保存当前查询会话，维持多轮上下文与前台展示一致性</text>

  <rect x="880" y="1032" rx="16" ry="16" width="560" height="82" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="2"/>
  <text x="1160" y="1066" text-anchor="middle" class="boxTitle">缓存、降级与恢复模块</text>
  <text x="1160" y="1090" text-anchor="middle" class="boxText">缓存中间结果，在外部能力波动时保障演示主链路不断</text>

