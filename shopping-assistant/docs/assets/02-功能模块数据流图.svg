<svg width="1600" height="1220" viewBox="0 0 1600 1220" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M1 1L10 6L1 11" stroke="#475569" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="arrowBlue" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M1 1L10 6L1 11" stroke="#2563EB" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="arrowDash" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M1 1L10 6L1 11" stroke="#7C3AED" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <style>
      .title { font: 700 28px "Microsoft YaHei", "PingFang SC", sans-serif; fill: #0F172A; }
      .subtitle { font: 500 15px "Microsoft YaHei", "PingFang SC", sans-serif; fill: #475569; }
      .section { font: 700 16px "Microsoft YaHei", "PingFang SC", sans-serif; fill: #1E293B; }
      .boxTitle { font: 700 18px "Microsoft YaHei", "PingFang SC", sans-serif; fill: #0F172A; }
      .boxText { font: 500 14px "Microsoft YaHei", "PingFang SC", sans-serif; fill: #334155; }
      .label { font: 600 13px "Microsoft YaHei", "PingFang SC", sans-serif; fill: #475569; }
      .legend { font: 600 13px "Microsoft YaHei", "PingFang SC", sans-serif; fill: #334155; }
    </style>
  </defs>

  <rect x="0" y="0" width="1600" height="1220" fill="#F8FAFC"/>
  <text x="800" y="54" text-anchor="middle" class="title">智能比价助手功能模块数据流关系图</text>
  <text x="800" y="82" text-anchor="middle" class="subtitle">按当前产品分块整理：主链路、多轮收敛、横向增强与支撑模块</text>

  <rect x="65" y="118" rx="14" ry="14" width="1470" height="830" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="2"/>
  <text x="95" y="150" class="section">A. 主链路与增强数据流</text>

  <rect x="610" y="180" rx="16" ry="16" width="380" height="78" fill="#DBEAFE" stroke="#60A5FA" stroke-width="2"/>
  <text x="800" y="212" text-anchor="middle" class="boxTitle">用户输入与会话启动模块</text>
  <text x="800" y="236" text-anchor="middle" class="boxText">输入图片，创建查询会话，记录本轮上下文入口</text>

  <rect x="610" y="302" rx="16" ry="16" width="380" height="78" fill="#E0F2FE" stroke="#38BDF8" stroke-width="2"/>
  <text x="800" y="334" text-anchor="middle" class="boxTitle">商品理解模块</text>
  <text x="800" y="358" text-anchor="middle" class="boxText">识别鞋类商品，形成商品画像，支持关键属性修正</text>

  <rect x="610" y="424" rx="16" ry="16" width="380" height="78" fill="#DCFCE7" stroke="#4ADE80" stroke-width="2"/>
  <text x="800" y="456" text-anchor="middle" class="boxTitle">跨平台检索与聚合模块</text>
  <text x="800" y="480" text-anchor="middle" class="boxText">基于商品画像找回多平台候选结果</text>

  <rect x="610" y="546" rx="16" ry="16" width="380" height="78" fill="#ECFCCB" stroke="#84CC16" stroke-width="2"/>
  <text x="800" y="578" text-anchor="middle" class="boxTitle">结果标准化与候选池模块</text>
  <text x="800" y="602" text-anchor="middle" class="boxText">统一不同来源结果，形成当前会话候选池</text>

  <rect x="160" y="688" rx="16" ry="16" width="320" height="92" fill="#F3E8FF" stroke="#A855F7" stroke-width="2"/>
