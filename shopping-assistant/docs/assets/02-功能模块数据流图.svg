  <text x="1280" y="746" text-anchor="middle" class="boxText">处理自然语言条件</text>
  <text x="1280" y="766" text-anchor="middle" class="boxText">过滤、重排或补充检索</text>

  <rect x="610" y="826" rx="16" ry="16" width="380" height="86" fill="#FEE2E2" stroke="#F87171" stroke-width="2"/>
