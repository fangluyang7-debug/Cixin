  <text x="800" y="746" text-anchor="middle" class="boxText">生成历史价格参考信息</text>
  <text x="800" y="766" text-anchor="middle" class="boxText">进入列表级比较与详情判断</text>

  <rect x="1120" y="688" rx="16" ry="16" width="320" height="92" fill="#FEF3C7" stroke="#F59E0B" stroke-width="2"/>
