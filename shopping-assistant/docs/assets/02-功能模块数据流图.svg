  <line x1="800" y1="912" x2="800" y2="958" stroke="#475569" stroke-width="3" marker-end="url(#arrow)"/>

  <path d="M1270 614V648" stroke="#2563EB" stroke-width="3" marker-end="url(#arrowBlue)"/>
  <path d="M1120 734H1040C1010 734 990 714 990 684V644" stroke="#2563EB" stroke-width="3" fill="none" marker-end="url(#arrowBlue)"/>
