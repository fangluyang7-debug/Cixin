  <text x="320" y="746" text-anchor="middle" class="boxText">输出建议卡片与主动推荐结论</text>
  <text x="320" y="766" text-anchor="middle" class="boxText">推动用户继续收敛结果</text>

  <rect x="640" y="688" rx="16" ry="16" width="320" height="92" fill="#FFEDD5" stroke="#FB923C" stroke-width="2"/>
