  <text x="800" y="884" text-anchor="middle" class="boxText">汇总价格、货源、平台、历史价格、时效等比较信息</text>

  <rect x="610" y="958" rx="16" ry="16" width="380" height="86" fill="#CCFBF1" stroke="#2DD4BF" stroke-width="2"/>
  <text x="800" y="992" text-anchor="middle" class="boxTitle">前台结果展示与商品详情模块</text>
  <text x="800" y="1016" text-anchor="middle" class="boxText">列表级比较、详情查看、购买前判断</text>

  <rect x="110" y="296" rx="16" ry="16" width="350" height="94" fill="#F5F3FF" stroke="#8B5CF6" stroke-width="2"/>
